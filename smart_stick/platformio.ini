; PlatformIO project for the Smart Stick firmware.
;
; Library versions are PINNED. The firmware in this repository has never been
; compiled against anything else, and an unpinned build is not reproducible:
; a future MPU9250_asukiaaa or ESP32 core release can change behaviour without
; a single line here changing.
;
; If you recover the original firmware build, replace these pins with the
; versions it actually used and record them in TRACEABILITY.md. The values
; below are the versions this tree was WRITTEN against, not the versions the
; reported experiments ran on -- nobody knows those yet.

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    asukiaaa/MPU9250_asukiaaa @ ^1.5.13

build_flags =
    -Wall
    -Wextra

; The .ino and its translation units live in this directory rather than src/,
; so point PlatformIO at it instead of restructuring a tree that also has to
; open in the Arduino IDE.
src_dir = .
